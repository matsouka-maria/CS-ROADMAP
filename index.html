<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOCK IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --panel:#FFFFFF; --ink:#181C35; --soft:#5D6482; --line:#E1E5EF;
  --violet:#5B4BDB; --watch:#C2413B; --read:#2D6FC2; --warn:#B7790B;
  --radius-lg:18px; --radius-sm:8px;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10132A;--panel:#181C38;--ink:#ECEEFA;--soft:#9EA4C4;--line:#2A2F52;--violet:#8E82FF;--watch:#F07068;--read:#6FA8F0;--warn:#E3AA3A}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:4px}

header{max-width:1180px;margin:0 auto;padding:40px 20px 8px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,5.5vw,56px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px}
.lede{color:var(--soft);max-width:66ch;margin:0}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rules span{font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

.route{max-width:1180px;margin:26px auto 0;padding:0 20px}
.route-track{position:relative;height:64px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.seg{position:absolute;top:10px;bottom:10px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--body);color:#fff;text-decoration:none;white-space:nowrap;overflow:hidden;padding:0 4px}
.seg.exam{background:repeating-linear-gradient(135deg,var(--line) 0 8px,transparent 8px 16px);color:var(--soft);border:1px dashed var(--soft)}
.months{position:relative;height:22px;margin-top:6px;font-size:12px;color:var(--soft)}
.months span{position:absolute;transform:translateX(-50%)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}

.layout{max-width:1180px;margin:28px auto 80px;padding:0 20px;display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
aside{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;max-height:calc(100vh - 32px);overflow:auto}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.filters button{font:500 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toc{list-style:none;margin:0;padding:0;font-size:14px}
.toc a{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:var(--radius-sm);text-decoration:none}
.toc a:hover{background:var(--bg)}
.toc .grp{font-size:12px;color:var(--soft);padding:10px 8px 2px}
.dot{width:12px;height:12px;border-radius:50%}
.pct{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.total{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13px;color:var(--soft)}
.total b{color:var(--ink)}

.part-title{font-family:var(--display);font-weight:700;font-size:26px;margin:8px 0 14px;letter-spacing:-.01em}
.part-title small{display:block;font:400 15px var(--body);color:var(--soft);margin-top:2px}
.part-title:not(:first-child){margin-top:40px}

.cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:22px;overflow:hidden;scroll-margin-top:16px}
.cat-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.num{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;width:52px;text-align:center}
.num.word{font-size:15px}
.cat h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.when{color:var(--soft);font-size:14px;margin-top:2px}
.why{font-size:14px;margin-top:6px;max-width:70ch}
.bar{width:120px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .3s}
.cat-body{display:grid;grid-template-columns:1.7fr 1fr}
.learn{padding:18px 22px;border-right:1px solid var(--line)}
.side{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
h3{font-family:var(--display);font-weight:700;font-size:15px;margin:0 0 10px}
.week{font-size:13px;font-weight:600;color:var(--soft);margin:16px 0 4px}
.week:first-of-type{margin-top:0}
ol.res{list-style:none;margin:0;padding:0}
ol.res li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.res li:first-child{border-top:0}
ol.res input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--violet);cursor:pointer}
.kind{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.kind.watch{color:var(--watch);background:color-mix(in srgb,var(--watch) 12%,transparent)}
.kind.read{color:var(--read);background:color-mix(in srgb,var(--read) 12%,transparent)}
.res-title{font-weight:600;text-decoration:none}
.res-title:hover{text-decoration:underline}
.hrs{font-size:13px;color:var(--soft);margin-left:6px;font-variant-numeric:tabular-nums}
li.done .res-title{text-decoration:line-through;color:var(--soft)}
.res-part{font-size:14.5px;margin-top:3px}
.res-note{font-size:13px;color:var(--warn);margin-top:3px}
.project{font-size:15px;margin:0}
.need{font-size:14px;color:var(--soft);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.cat.exam .cat-body{display:block;padding:18px 22px}
.cat.exam ul{margin:10px 0 0;padding-left:20px}

h1{font-size:clamp(52px,11vw,120px)!important;line-height:.95!important;letter-spacing:-.035em!important;margin:0 0 22px!important}
.lockin{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;font:800 clamp(20px,2.4vw,28px)/1.05 var(--display);letter-spacing:-.01em;text-transform:uppercase}
.rule-n{font:600 12px/1 var(--body);letter-spacing:.08em;color:var(--soft);margin-bottom:10px;text-transform:uppercase}
.rule.last{background:var(--ink);color:var(--panel)}
.rule.last .rule-n{color:var(--panel);opacity:.7}
.rule.leet{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.rule-t{margin-bottom:14px}
.daily{display:flex;align-items:center;gap:12px;font:600 18px var(--body);text-transform:none;letter-spacing:0;cursor:pointer}
.daily input{width:30px;height:30px;accent-color:var(--violet);cursor:pointer;margin:0}
.daily input:checked + span{text-decoration:line-through;text-decoration-thickness:2px;color:var(--soft)}
.hint{font:500 14px var(--body);text-transform:none;letter-spacing:0;color:var(--soft);margin-top:8px}
.hint a{color:var(--read)}
.warn.ok{color:var(--read)}
.warn{font:500 14px var(--body);text-transform:none;letter-spacing:0;color:var(--watch);margin-top:10px;min-height:20px}
.streak{display:flex;align-items:baseline;gap:10px}
.flame{font-size:40px;line-height:1}
.streak b{font:800 64px/1 var(--display);letter-spacing:-.03em}
.streak-l{font:600 16px var(--body);text-transform:none;letter-spacing:0;color:var(--soft)}
.best{font:500 14px var(--body);text-transform:none;letter-spacing:0;color:var(--soft);margin-top:4px}
.days{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.days i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.days i.on{background:var(--violet)}
.days i.now{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:860px){.lockin{grid-template-columns:1fr 1fr}.rule.leet{grid-template-columns:1fr}}
@media (max-width:520px){.lockin{grid-template-columns:1fr}}
.hidden{display:none!important}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  .cat-body{grid-template-columns:1fr}
  .learn{border-right:0;border-bottom:1px solid var(--line)}
  .seg{font-size:0}
  .bar{width:70px}
  .num{font-size:30px;width:38px}
}
</style>
</head>
<body>
<header>
  <h1>LOCK IN <span aria-hidden="true">🔒</span></h1>
  <div class="lockin">
    <section class="rule leet" aria-label="Daily LeetCode streak">
      <div>
        <div class="rule-n">Rule 1</div>
        <div class="rule-t">1 LeetCode problem per day</div>
        <label class="daily"><input type="checkbox" id="today"><span>Done today</span></label>
        <div class="warn" id="warn"></div>
        <div class="hint">Use the <a href="https://neetcode.io" target="_blank" rel="noopener">NeetCode 150 list</a>. Try each problem for 25 minutes. Then watch the video.</div>
      </div>
      <div class="streakbox">
        <div class="streak"><span class="flame" aria-hidden="true">🔥</span><b id="streakn">0</b><span class="streak-l">day streak</span></div>
        <div class="best" id="best"></div>
        <div class="days" id="dots" aria-label="Last 14 days"></div>
      </div>
    </section>
    <div class="rule"><div class="rule-n">Rule 2</div>No AI.</div>
    <div class="rule"><div class="rule-n">Rule 3</div>Learn now, not later.</div>
    <div class="rule"><div class="rule-n">Rule 4</div>Do not waste time.</div>
    <div class="rule last"><div class="rule-n">Rule 5</div>DO NOT GIVE UP.</div>
  </div>
</header>

<div class="route" aria-label="Timeline of all phases">
  <div class="route-track" id="track"></div>
  <div class="months" id="months"></div>
</div>

<div class="layout">
  <aside>
    <input class="search" id="q" type="search" placeholder="Search a topic, book, or lecture" aria-label="Search">
    <div class="filters" role="group" aria-label="Filter steps">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="watch" aria-pressed="false">Watch</button>
      <button data-f="read" aria-pressed="false">Read</button>
      <button data-f="todo" aria-pressed="false">Not done</button>
    </div>
    <ul class="toc" id="toc"></ul>
    <div class="total" id="total"></div>
  </aside>
  <main id="main"></main>
</div>

const KEY="route-done-v2";
let done={};try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cats=data.filter(c=>c.id);

/* Route bar */
const t0=new Date("2026-11-02"),t1=new Date("2027-06-28"),span=t1-t0;
const track=document.getElementById("track"),months=document.getElementById("months");
cats.filter(c=>c.start).forEach(c=>{
  (c.split||[[c.start,c.end]]).forEach(([s,e])=>{
    const a=document.createElement("a");a.href="#"+c.id;a.className="seg"+(c.exam?" exam":"");
    const l=(new Date(s)-t0)/span*100,w=(new Date(e)-new Date(s)+864e5)/span*100;
    a.style.left=l+"%";a.style.width="calc("+w+"% - 3px)";if(!c.exam)a.style.background=c.color;
    a.textContent=c.exam?"Exams":c.n;a.title=c.t+": "+fmt(s)+" to "+fmt(e);track.appendChild(a);
  });
});
["2026-12-01","2027-01-01","2027-02-01","2027-03-01","2027-04-01","2027-05-01","2027-06-01"].forEach(m=>{
  const s=document.createElement("span");s.style.left=((new Date(m)-t0)/span*100)+"%";
  s.textContent=new Date(m).toLocaleDateString("en-GB",{month:"short"});months.appendChild(s);
});
const now=new Date();if(now>t0&&now<t1){const d=document.createElement("div");d.className="today";d.title="Today";d.style.left=((now-t0)/span*100)+"%";track.appendChild(d)}

/* Sections */
const main=document.getElementById("main"),toc=document.getElementById("toc");
data.forEach(c=>{
  if(c.group){
    main.insertAdjacentHTML("beforeend",`<h2 class="part-title" data-group>${c.group}${c.sub?`<small>${c.sub}</small>`:""}</h2>`);
    toc.insertAdjacentHTML("beforeend",`<li class="grp">${c.group}</li>`);return;
  }
  toc.insertAdjacentHTML("beforeend",`<li><a href="#${c.id}"><span class="dot" style="background:${c.color||"transparent"};${c.exam?"border:1px dashed var(--soft)":""}"></span><span>${/^\d+$/.test(c.n||"")?c.n+". ":""}${c.t}</span><span class="pct" id="p-${c.id}"></span></a></li>`);
  const dates=c.start?`${fmt(c.start)} to ${fmt(c.end)}, ${c.hours}`:c.hours;
  let lastWeek=null;
  const steps=c.steps.map((s,i)=>{
    const [kind,title,url,part,hrs,week,note]=s,k=c.id+"-"+i;
    let wk="";if(week&&week!==lastWeek){wk=`</ol><div class="week">${week}</div><ol class="res">`;lastWeek=week;}
    return `${wk}<li data-kind="${kind}" data-k="${k}" class="${done[k]?"done":""}"><input type="checkbox" aria-label="Mark step as done" ${done[k]?"checked":""}><div><span class="kind ${kind}">${kind==="watch"?"Watch":"Read"}</span><a class="res-title" href="${url}" target="_blank" rel="noopener">${esc(title)}</a>${hrs?`<span class="hrs">${hrs}h</span>`:""}<div class="res-part">${esc(part)}</div>${note?`<div class="res-note">${esc(note)}</div>`:""}</div></li>`;
  }).join("");
  main.insertAdjacentHTML("beforeend",`<section class="cat${c.exam?" exam":""}" id="${c.id}">
    <div class="cat-head"><div class="num${c.n&&c.n.length>2?" word":""}" style="color:${c.color||"var(--soft)"}">${c.n}</div><div><h2>${c.t}</h2><div class="when">${dates}</div>${c.exam?"":`<div class="why">${c.why}</div>`}</div>${c.steps.length?`<div class="bar" title="Progress"><i id="b-${c.id}" style="background:${c.color}"></i></div>`:""}</div>
    <div class="cat-body">${c.exam?`<p class="project">${c.why}</p>`:`
      <div class="learn"><h3>Watch and read, in this order</h3><ol class="res">${steps}</ol></div>
      <div class="side"><div><h3>Then build</h3><p class="project">${c.project}</p></div><div><h3>You need first</h3><p class="need">${c.need}</p></div></div>`}
    </div></section>`);
});
document.querySelectorAll("ol.res").forEach(o=>{if(!o.children.length)o.remove()});

function progress(){
  let all=0,fin=0;
  cats.forEach(c=>{if(!c.steps.length)return;const n=c.steps.length,d=c.steps.filter((_,i)=>done[c.id+"-"+i]).length;all+=n;fin+=d;
    document.getElementById("p-"+c.id).textContent=d+"/"+n;document.getElementById("b-"+c.id).style.width=(d/n*100)+"%";});
  document.getElementById("total").innerHTML=`<b>${fin} of ${all}</b> steps done`;
}
main.addEventListener("change",e=>{
  const li=e.target.closest("li[data-k]");if(!li)return;
  done[li.dataset.k]=e.target.checked;li.classList.toggle("done",e.target.checked);save();progress();apply();
});

let filter="all";
function apply(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll(".cat").forEach(s=>{
    let any=false;const head=s.querySelector(".cat-head").textContent.toLowerCase();
    s.querySelectorAll("li[data-k]").forEach(li=>{
      const okF=filter==="all"||(filter==="todo"?!li.classList.contains("done"):li.dataset.kind===filter);
      const okQ=!q||li.textContent.toLowerCase().includes(q)||head.includes(q);
      li.classList.toggle("hidden",!(okF&&okQ));if(okF&&okQ)any=true;
    });
    s.querySelectorAll(".week").forEach(w=>{const ol=w.nextElementSibling;w.classList.toggle("hidden",!ol||!ol.querySelector("li:not(.hidden)"))});
    s.classList.toggle("hidden",s.classList.contains("exam")?(!!q||filter!=="all"):!any);
  });
  document.querySelectorAll("[data-group]").forEach(g=>g.classList.toggle("hidden",!!q||filter!=="all"));
}
document.getElementById("q").addEventListener("input",apply);
document.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;document.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));apply();
}));
progress();
/* Lock In: daily LeetCode streak */
const LK="lockin-days-v1";let days={};try{days=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function lockin(){
  const now=new Date(),tk=dkey(now),done=!!days[tk];
  let streak=0;const d=new Date(now);if(!days[dkey(d)])d.setDate(d.getDate()-1);
  while(days[dkey(d)]){streak++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  Object.keys(days).filter(k=>days[k]).sort().forEach(k=>{const t=new Date(k+"T12:00");run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;prev=t;if(run>best)best=run});
  document.getElementById("today").checked=done;
  document.getElementById("streakn").textContent=streak;
  document.getElementById("best").textContent=best?"Best: "+best+(best===1?" day":" days"):"";
  document.getElementById("warn").classList.toggle("ok",done);document.getElementById("warn").textContent=done?"Locked in today. Come back tomorrow.":(streak>0?"Your "+streak+"-day streak dies at midnight. Solve one now.":"Zero days. Solve one now.");
  const box=document.getElementById("dots");box.innerHTML="";
  for(let n=13;n>=0;n--){const x=new Date(now);x.setDate(x.getDate()-n);const e=document.createElement("i");
    if(days[dkey(x)])e.className="on";if(n===0)e.classList.add("now");e.title=dkey(x);box.appendChild(e)}
}
document.getElementById("today").addEventListener("change",e=>{days[dkey(new Date())]=e.target.checked;try{localStorage.setItem(LK,JSON.stringify(days))}catch(x){}lockin()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)lockin()});
lockin();
</script>
